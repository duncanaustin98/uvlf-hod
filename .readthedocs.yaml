# Read the Docs configuration for halogal
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# Read the Docs rebuilds "latest" on every push to main through its GitHub
# webhook; .github/workflows/docs.yml builds the same docs on every PR (so a
# broken build is caught before merge) and can also trigger the RTD build.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

formats:
  - epub

python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
